<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Vendors | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('vendors')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Vendors', 'Vendors')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Vendors</h1>
                    <div class="page-actions">
                        <a th:href="@{/vendors/new}" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            Add Vendor
                        </a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Search and Stats -->
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <form th:action="@{/vendors}" method="get" style="display: flex; gap: 0.5rem; flex: 1; min-width: 300px;">
                        <input type="text"
                               name="search"
                               th:value="${search}"
                               placeholder="Search vendors..."
                               class="form-control"
                               style="flex: 1;">
                        <button type="submit" class="btn btn-secondary">Search</button>
                        <a th:href="@{/vendors}" class="btn btn-outline">Clear</a>
                    </form>
                </div>

                <!-- Stats Cards -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Total Vendors</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-deep-burgundy);" th:text="${totalVendors}">0</div>
                    </div>
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Active Vendors</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-success);" th:text="${activeVendors}">0</div>
                    </div>
                </div>

                <!-- Vendors Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Contact Person</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${vendors.isEmpty()}">
                                    <td colspan="6" style="text-align: center; padding: 3rem;">
                                        <div class="empty-state">
                                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                            </svg>
                                            <h4 class="empty-state-title">No Vendors Found</h4>
                                            <p class="empty-state-text" th:text="${searchMessage != null ? ${searchMessage} : 'Start by adding your first vendor'}">No vendors found</p>
                                            <a th:href="@{/vendors/new}" class="btn btn-primary btn-sm">Add Vendor</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="vendor : ${vendors}">
                                    <td>
                                        <a th:href="@{/vendors/{id}(id=${vendor.id})}"
                                           th:text="${vendor.name}"
                                           style="font-weight: 500; color: var(--color-deep-burgundy);">
                                            Vendor Name
                                        </a>
                                    </td>
                                    <td>
                                        <span class="badge badge-secondary" th:text="${vendor.category}">Category</span>
                                    </td>
                                    <td th:text="${vendor.contactPerson != null ? vendor.contactPerson : '-'}">Contact Person</td>
                                    <td th:text="${vendor.phone != null ? vendor.phone : '-'}">+94 77 123 4567</td>
                                    <td>
                                        <span class="badge" th:class="${vendor.active ? 'badge-success' : 'badge-secondary'}"
                                              th:text="${vendor.active ? 'Active' : 'Archived'}">
                                            Active
                                        </span>
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <a th:href="@{/vendors/{id}(id=${vendor.id})}"
                                               class="btn btn-sm btn-outline"
                                               title="View">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                                </svg>
                                            </a>
                                            <a th:href="@{/vendors/edit/{id}(id=${vendor.id})}"
                                               class="btn btn-sm btn-outline"
                                               title="Edit">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                </svg>
                                            </a>
                                            <form th:action="@{/vendors/delete/{id}(id=${vendor.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to archive this vendor?');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Archive">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                    </svg>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
