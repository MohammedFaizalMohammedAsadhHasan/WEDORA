<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Staff | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('staff')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Staff', 'Staff')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Staff Management</h1>
                    <div class="page-actions">
                        <a th:href="@{/staff/new}" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            Add Staff
                        </a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Staff Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Position</th>
                                    <th>Department</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${staffList.isEmpty()}">
                                    <td colspan="7" style="text-align: center; padding: 3rem;">
                                        <div class="empty-state">
                                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                            </svg>
                                            <h4 class="empty-state-title">No Staff Members</h4>
                                            <p class="empty-state-text">Start by adding your first staff member</p>
                                            <a th:href="@{/staff/new}" class="btn btn-primary btn-sm">Add Staff</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="staff : ${staffList}">
                                    <td>
                                        <div style="font-weight: 500;" th:text="${staff.firstName + ' ' + staff.lastName}">Full Name</div>
                                    </td>
                                    <td th:text="${staff.position != null ? staff.position : '-'}">Position</td>
                                    <td th:text="${staff.department != null ? staff.department : '-'}">Department</td>
                                    <td th:text="${staff.email != null ? staff.email : '-'}">email@example.com</td>
                                    <td th:text="${staff.phone != null ? staff.phone : '-'}">+94 77 123 4567</td>
                                    <td>
                                        <span class="badge" th:class="${staff.active ? 'badge-success' : 'badge-secondary'}" th:text="${staff.active ? 'Active' : 'Archived'}">Active</span>
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <a th:href="@{/staff/edit/{id}(id=${staff.id})}" class="btn btn-sm btn-outline">Edit</a>
                                            <form th:if="${staff.active}"
                                                  th:action="@{/staff/archive/{id}(id=${staff.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to archive this staff member?');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-warning">Archive</button>
                                            </form>
                                            <form th:action="@{/staff/delete/{id}(id=${staff.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to delete this staff member? This cannot be undone.');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
