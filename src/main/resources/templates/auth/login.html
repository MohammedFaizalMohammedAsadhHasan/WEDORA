
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isLogin=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sign In | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Branding -->
        <div class="login-left">
            <div class="login-brand">
                <h1>WEDORA</h1>
                <p class="tagline">Where Every Celebration Begins</p>
            </div>
            <div class="login-decoration">
                <div class="decoration-item">💍</div>
                <div class="decoration-item">🌸</div>
                <div class="decoration-item">✨</div>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="login-right">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p class="subtitle">Sign in to manage your wedding business</p>

                <div th:if="${param.error}" class="login-alert error">
                    Invalid username or password. Please try again.
                </div>

                <div th:if="${param.logout}" class="login-alert success">
                    You have successfully logged out.
                </div>

                <div th:if="${error}" class="login-alert error" th:text="${error}"></div>
                <div th:if="${success}" class="login-alert success" th:text="${success}"></div>
                <div th:if="${info}" class="login-alert info" th:text="${info}"></div>

                <form th:action="@{/login}" method="post" class="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Email or Username</label>
                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               placeholder="Enter your email or username"
                               required
                               autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div style="position: relative;">
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required
                                   style="padding-right: 3rem;">
                            <button type="button"
                                    id="togglePassword"
                                    style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; font-size: 1.25rem;">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Sign In
                    </button>
                </form>

                <div class="login-footer">
                    <p>Forgot your password? <a href="#">Reset here</a></p>
                    <p style="margin-top: 0.5rem;">New to WEDORA? <a href="#">Contact administrator</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
            });
        });
    </script>
</body>
</html>
