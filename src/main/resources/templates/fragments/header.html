<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="header(title, breadcrumb)">
    <header class="header">
        <div class="header-left">
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <nav class="header-breadcrumb" th:if="${breadcrumb != null}">
                <a th:href="@{/dashboard}">Dashboard</a>
                <span>/</span>
                <span class="current" th:text="${breadcrumb}">Page</span>
            </nav>
        </div>

        <div class="header-right">
            <div class="header-search">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" placeholder="Search customers, weddings, vendors..." aria-label="Search">
            </div>

            <div class="header-notifications" aria-label="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                <span class="badge">3</span>
            </div>

            <div class="header-user" aria-label="User menu">
                <div class="header-user-avatar">OW</div>
                <div>
                    <div class="header-user-name">Business Owner</div>
                    <div class="header-user-role">Administrator</div>
                </div>
            </div>
        </div>
    </header>
</th:block>
</html>
