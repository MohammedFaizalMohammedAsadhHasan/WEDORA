<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title th:text="${title != null ? title + ' | WEDORA' : 'WEDORA | Where Every Celebration Begins'}">WEDORA | Where Every Celebration Begins</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" th:if="${isDashboard != null and isDashboard}">
    <link rel="stylesheet" th:href="@{/css/login.css}" th:if="${isLogin != null and isLogin}">

    <!-- Favicon placeholder -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body>
    <div layout:fragment="content"></div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
