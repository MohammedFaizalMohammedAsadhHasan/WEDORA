<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Bookings | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('bookings')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Bookings', 'Bookings')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Bookings</h1>
                    <div class="page-actions">
                        <a th:href="@{/bookings/new}" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            New Booking
                        </a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Stats Cards -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Total Bookings</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-deep-burgundy);" th:text="${totalBookings}">0</div>
                    </div>
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Active Bookings</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-success);" th:text="${activeBookings}">0</div>
                    </div>
                </div>

                <!-- Bookings Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Wedding</th>
                                    <th>Vendor</th>
                                    <th>Date & Time</th>
                                    <th>Package</th>
                                    <th>Price (LKR)</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${bookings.isEmpty()}">
                                    <td colspan="7" style="text-align: center; padding: 3rem;">
                                        <div class="empty-state">
                                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                            </svg>
                                            <h4 class="empty-state-title">No Bookings Found</h4>
                                            <p class="empty-state-text">Start by creating your first booking</p>
                                            <a th:href="@{/bookings/new}" class="btn btn-primary btn-sm">Create Booking</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="booking : ${bookings}">
                                    <td th:text="${booking.weddingId}">Wedding ID</td>
                                    <td th:text="${booking.vendorId}">Vendor ID</td>
                                    <td th:text="${#temporals.format(booking.bookingDateTime, 'MMM dd, yyyy HH:mm')}">Jan 01, 2025 14:00</td>
                                    <td th:text="${booking.packageName != null ? booking.packageName : '-'}">Package</td>
                                    <td th:text="${booking.price != null ? booking.price : '-'}">0.00</td>
                                    <td>
                                        <span class="badge"
                                              th:class="${booking.status == 'PENDING' ? 'badge-warning' : booking.status == 'CONFIRMED' ? 'badge-success' : booking.status == 'COMPLETED' ? 'badge-primary' : 'badge-danger'}"
                                              th:text="${booking.status}">
                                            PENDING
                                        </span>
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <a th:href="@{/bookings/{id}(id=${booking.id})}"
                                               class="btn btn-sm btn-outline"
                                               title="View">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                                </svg>
                                            </a>
                                            <a th:href="@{/bookings/edit/{id}(id=${booking.id})}"
                                               class="btn btn-sm btn-outline"
                                               title="Edit">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                </svg>
                                            </a>
                                            <form th:if="${booking.status == 'PENDING'}"
                                                  th:action="@{/bookings/confirm/{id}(id=${booking.id})}"
                                                  method="post"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-success" title="Confirm" style="background-color: var(--color-success); color: white; border: none;">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                                    </svg>
                                                </button>
                                            </form>
                                            <form th:if="${booking.status != 'CANCELLED'}"
                                                  th:action="@{/bookings/cancel/{id}(id=${booking.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to cancel this booking?');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Cancel">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                    </svg>
                                                </button>
                                            </form>
                                            <form th:action="@{/bookings/delete/{id}(id=${booking.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to delete this booking?');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Delete">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                    </svg>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
