<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Tasks | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('tasks')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Tasks', 'Tasks')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Tasks</h1>
                    <div class="page-actions">
                        <a th:href="@{/tasks/new}" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            Add Task
                        </a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Overdue Alert -->
                <div th:if="${!overdueTasks.isEmpty()}" class="alert alert-danger">
                    <strong>Overdue Tasks:</strong> <span th:text="${overdueTasks.size()}"></span> tasks are overdue!
                </div>

                <!-- Tasks Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Wedding</th>
                                    <th>Due Date</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${tasks.isEmpty()}">
                                    <td colspan="6" style="text-align: center; padding: 3rem;">
                                        <div class="empty-state">
                                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                                            </svg>
                                            <h4 class="empty-state-title">No Tasks Found</h4>
                                            <p class="empty-state-text">Start by creating your first task</p>
                                            <a th:href="@{/tasks/new}" class="btn btn-primary btn-sm">Add Task</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="task : ${tasks}" th:style="${task.dueDate != null && #temporals.create(task.dueDate).isBefore(#temporals.createNow()) && task.status != 'COMPLETED' ? 'background-color: #fef2f2;' : ''}">
                                    <td>
                                        <div style="font-weight: 500;" th:text="${task.title}">Task Title</div>
                                        <div style="font-size: 0.875rem; color: var(--color-muted-text);" th:text="${task.description != null ? task.description : ''}">Description</div>
                                    </td>
                                    <td th:text="${task.weddingId}">Wedding ID</td>
                                    <td th:text="${task.dueDate != null ? #temporals.format(task.dueDate, 'MMM dd, yyyy') : '-'}">Jan 01, 2025</td>
                                    <td>
                                        <span class="badge" th:class="${task.priority == 'URGENT' ? 'badge-danger' : task.priority == 'HIGH' ? 'badge-warning' : task.priority == 'MEDIUM' ? 'badge-info' : 'badge-secondary'}" th:text="${task.priority}">MEDIUM</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:class="${task.status == 'COMPLETED' ? 'badge-success' : task.status == 'IN_PROGRESS' ? 'badge-primary' : 'badge-secondary'}" th:text="${task.status}">TODO</span>
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="btn btn-sm btn-outline">Edit</a>
                                            <form th:if="${task.status != 'COMPLETED'}"
                                                  th:action="@{/tasks/complete/{id}(id=${task.id})}"
                                                  method="post"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-success" style="background-color: var(--color-success); color: white; border: none;">Complete</button>
                                            </form>
                                            <form th:action="@{/tasks/delete/{id}(id=${task.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to delete this task?');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
