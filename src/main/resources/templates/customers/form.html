<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title th:text="${isEdit ? 'Edit Customer | WEDORA' : 'Add Customer | WEDORA'}">Customer | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('customers')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header(isEdit ? 'Edit Customer' : 'Add Customer', 'Customers')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title" th:text="${isEdit ? 'Edit Customer' : 'Add Customer'}">Add Customer</h1>
                    <div class="page-actions">
                        <a th:href="@{/customers}" class="btn btn-outline">Back to List</a>
                    </div>
                </div>

                <!-- Form Card -->
                <div class="card" style="max-width: 800px;">
                    <div class="card-body">
                        <form th:action="${isEdit ? @{/customers/edit/{id}(id=${customer.id})} : @{/customers/new}}"
                              method="post"
                              th:object="${customer}">

                            <!-- Full Name -->
                            <div class="form-group">
                                <label for="fullName" class="form-label">Full Name *</label>
                                <input type="text"
                                       id="fullName"
                                       th:field="*{fullName}"
                                       class="form-control"
                                       placeholder="Enter customer's full name"
                                       required>
                                <div th:if="${#fields.hasErrors('fullName')}" class="form-text" style="color: var(--color-error);">
                                    <span th:errors="*{fullName}">Name is required</span>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       placeholder="customer@example.com">
                                <div class="form-text">Optional but recommended for communication</div>
                                <div th:if="${#fields.hasErrors('email')}" class="form-text" style="color: var(--color-error);">
                                    <span th:errors="*{email}">Invalid email format</span>
                                </div>
                            </div>

                            <!-- Phone -->
                            <div class="form-group">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel"
                                       id="phone"
                                       th:field="*{phone}"
                                       class="form-control"
                                       placeholder="+94 77 123 4567">
                                <div class="form-text">Optional but recommended for communication</div>
                                <div th:if="${#fields.hasErrors('phone')}" class="form-text" style="color: var(--color-error);">
                                    <span th:errors="*{phone}">Invalid phone format</span>
                                </div>
                            </div>

                            <!-- Address -->
                            <div class="form-group">
                                <label for="address" class="form-label">Address</label>
                                <textarea id="address"
                                          th:field="*{address}"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Enter customer's address"></textarea>
                            </div>

                            <!-- Notes -->
                            <div class="form-group">
                                <label for="notes" class="form-label">Notes</label>
                                <textarea id="notes"
                                          th:field="*{notes}"
                                          class="form-control"
                                          rows="4"
                                          placeholder="Additional notes about the customer..."></textarea>
                                <div class="form-text">Any additional information that might be helpful</div>
                            </div>

                            <!-- Status (Edit mode only) -->
                            <div class="form-group" th:if="${isEdit}">
                                <label class="form-check">
                                    <input type="checkbox"
                                           th:field="*{active}"
                                           class="form-check-input">
                                    <span class="form-check-label">Active Customer</span>
                                </label>
                                <div class="form-text">Uncheck to archive this customer</div>
                            </div>

                            <!-- Form Actions -->
                            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                                <button type="submit" class="btn btn-primary">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                    <span th:text="${isEdit ? 'Update Customer' : 'Create Customer'}">Create Customer</span>
                                </button>
                                <a th:href="@{/customers}" class="btn btn-outline">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
