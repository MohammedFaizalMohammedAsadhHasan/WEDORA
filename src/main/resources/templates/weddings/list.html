<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Weddings | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('weddings')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Weddings', 'Weddings')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Weddings</h1>
                    <div class="page-actions">
                        <a th:href="@{/weddings/new}" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            New Wedding
                        </a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Search and Stats -->
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <form th:action="@{/weddings}" method="get" style="display: flex; gap: 0.5rem; flex: 1; min-width: 300px;">
                        <input type="text"
                               name="search"
                               th:value="${search}"
                               placeholder="Search by bride or groom name..."
                               class="form-control"
                               style="flex: 1;">
                        <button type="submit" class="btn btn-secondary">Search</button>
                        <a th:href="@{/weddings}" class="btn btn-outline">Clear</a>
                    </form>
                </div>

                <!-- Stats Cards -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Total Weddings</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-deep-burgundy);" th:text="${totalWeddings}">0</div>
                    </div>
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Upcoming Weddings</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-success);" th:text="${upcomingWeddings}">0</div>
                    </div>
                </div>

                <!-- Weddings Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Couple</th>
                                    <th>Wedding Date</th>
                                    <th>Venue</th>
                                    <th>Guests</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${weddings.isEmpty()}">
                                    <td colspan="6" style="text-align: center; padding: 3rem;">
                                        <div class="empty-state">
                                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                            </svg>
                                            <h4 class="empty-state-title">No Weddings Found</h4>
                                            <p class="empty-state-text" th:text="${searchMessage != null ? ${searchMessage} : 'Start by creating your first wedding event'}">No weddings found</p>
                                            <a th:href="@{/weddings/new}" class="btn btn-primary btn-sm">Create Wedding</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="wedding : ${weddings}">
                                    <td>
                                        <div style="font-weight: 500; color: var(--color-deep-burgundy);">
                                            <span th:text="${wedding.brideName}">Bride</span>
                                            <span style="color: var(--color-muted-text);">&</span>
                                            <span th:text="${wedding.groomName}">Groom</span>
                                        </div>
                                    </td>
                                    <td th:text="${#temporals.format(wedding.weddingDate, 'MMM dd, yyyy')}">Jan 01, 2025</td>
                                    <td th:text="${wedding.venue != null ? wedding.venue : '-'}">Venue</td>
                                    <td th:text="${wedding.estimatedGuests != null ? wedding.estimatedGuests : '-'}">100</td>
                                    <td>
                                        <span class="badge"
                                              th:class="${wedding.status == 'PLANNING' ? 'badge-warning' : wedding.status == 'CONFIRMED' ? 'badge-info' : wedding.status == 'IN_PROGRESS' ? 'badge-primary' : wedding.status == 'COMPLETED' ? 'badge-success' : 'badge-danger'}"
                                              th:text="${wedding.status}">
                                            PLANNING
                                        </span>
                                    </td>
                                    <td>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <a th:href="@{/weddings/{id}(id=${wedding.id})}"
                                               class="btn btn-sm btn-outline"
                                               title="View">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                                </svg>
                                            </a>
                                            <a th:href="@{/weddings/edit/{id}(id=${wedding.id})}"
                                               class="btn btn-sm btn-outline"
                                               title="Edit">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                </svg>
                                            </a>
                                            <form th:if="${wedding.status != 'CANCELLED'}"
                                                  th:action="@{/weddings/cancel/{id}(id=${wedding.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to cancel this wedding?');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Cancel">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                                    </svg>
                                                </button>
                                            </form>
                                            <form th:action="@{/weddings/delete/{id}(id=${wedding.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to delete this wedding?');"
                                                  style="display: inline;">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Delete">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                    </svg>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
