<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Wedding Details | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('weddings')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Wedding Details', 'Weddings')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Wedding Details</h1>
                    <div class="page-actions">
                        <a th:href="@{/weddings/edit/{id}(id=${wedding.id})}" class="btn btn-secondary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                            Edit
                        </a>
                        <a th:href="@{/weddings}" class="btn btn-outline">Back to List</a>
                    </div>
                </div>

                <!-- Wedding Details Card -->
                <div class="card" style="max-width: 800px;">
                    <div class="card-header">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3>
                                <span th:text="${wedding.brideName}">Bride</span>
                                <span style="color: var(--color-muted-text);">&</span>
                                <span th:text="${wedding.groomName}">Groom</span>
                            </h3>
                            <span class="badge"
                                  th:class="${wedding.status == 'PLANNING' ? 'badge-warning' : wedding.status == 'CONFIRMED' ? 'badge-info' : wedding.status == 'IN_PROGRESS' ? 'badge-primary' : wedding.status == 'COMPLETED' ? 'badge-success' : 'badge-danger'}"
                                  th:text="${wedding.status}">
                                PLANNING
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem;">
                            <!-- Wedding Information -->
                            <div>
                                <h4 style="font-size: 1rem; color: var(--color-muted-text); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">Wedding Information</h4>
                                <div style="margin-bottom: 1rem;">
                                    <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.25rem;">Wedding Date</div>
                                    <div style="font-size: 1rem; color: var(--color-dark-text);" th:text="${#temporals.format(wedding.weddingDate, 'MMMM dd, yyyy')}">January 01, 2025</div>
                                </div>
                                <div style="margin-bottom: 1rem;">
                                    <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.25rem;">Venue</div>
                                    <div style="font-size: 1rem; color: var(--color-dark-text);" th:text="${wedding.venue != null ? wedding.venue : 'Not specified'}">Venue Name</div>
                                </div>
                                <div style="margin-bottom: 1rem;">
                                    <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.25rem;">Estimated Guests</div>
                                    <div style="font-size: 1rem; color: var(--color-dark-text);" th:text="${wedding.estimatedGuests != null ? wedding.estimatedGuests : 'Not specified'}">100</div>
                                </div>
                                <div style="margin-bottom: 1rem;">
                                    <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.25rem;">Status</div>
                                    <span class="badge"
                                          th:class="${wedding.status == 'PLANNING' ? 'badge-warning' : wedding.status == 'CONFIRMED' ? 'badge-info' : wedding.status == 'IN_PROGRESS' ? 'badge-primary' : wedding.status == 'COMPLETED' ? 'badge-success' : 'badge-danger'}"
                                          th:text="${wedding.status}">
                                        PLANNING
                                    </span>
                                </div>
                            </div>

                            <!-- Additional Information -->
                            <div>
                                <h4 style="font-size: 1rem; color: var(--color-muted-text); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">Additional Information</h4>
                                <div style="margin-bottom: 1rem;">
                                    <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.25rem;">Wedding ID</div>
                                    <div style="font-size: 0.875rem; color: var(--color-dark-text); font-family: monospace;" th:text="${wedding.id}">UUID</div>
                                </div>
                                <div style="margin-bottom: 1rem;">
                                    <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.25rem;">Customer ID</div>
                                    <div style="font-size: 0.875rem; color: var(--color-dark-text); font-family: monospace;" th:text="${wedding.customerId}">UUID</div>
                                </div>
                                <div th:if="${wedding.notes != null && !wedding.notes.isEmpty()}">
                                    <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.25rem;">Notes</div>
                                    <div style="font-size: 0.875rem; color: var(--color-dark-text); line-height: 1.6;" th:text="${wedding.notes}">Wedding notes</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="card" style="max-width: 800px; margin-top: 1.5rem;">
                    <div class="card-body">
                        <h4 style="font-size: 1rem; margin-bottom: 1rem;">Quick Actions</h4>
                        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                            <a th:href="@{/weddings/edit/{id}(id=${wedding.id})}" class="btn btn-outline">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                </svg>
                                Edit Wedding
                            </a>
                            <form th:if="${wedding.status != 'CANCELLED'}"
                                  th:action="@{/weddings/cancel/{id}(id=${wedding.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to cancel this wedding?');"
                                  style="display: inline;">
                                <button type="submit" class="btn btn-danger">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                    Cancel Wedding
                                </button>
                            </form>
                            <form th:action="@{/weddings/delete/{id}(id=${wedding.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this wedding? This cannot be undone.');"
                                  style="display: inline;">
                                <button type="submit" class="btn btn-danger">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                    Delete Wedding
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
