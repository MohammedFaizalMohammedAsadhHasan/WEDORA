<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:with="isDashboard=true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Wedding Finance | WEDORA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('finance')}"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div th:replace="~{fragments/header :: header('Wedding Finance', 'Finance')}"></div>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">
                        <span th:text="${wedding.brideName}">Bride</span>
                        <span style="color: var(--color-muted-text);">&</span>
                        <span th:text="${wedding.groomName}">Groom</span>
                        <span style="color: var(--color-muted-text); font-size: 1.5rem;">- Finance</span>
                    </h1>
                    <div class="page-actions">
                        <a th:href="@{/finance}" class="btn btn-outline">Back to Overview</a>
                    </div>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Finance Summary Cards -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Total Bookings</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-success);" th:text="${totalBookings != null ? 'LKR ' + totalBookings : 'LKR 0.00'}">LKR 0.00</div>
                    </div>
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Total Expenses</div>
                        <div style="font-size: 2rem; font-weight: 600; color: var(--color-error);" th:text="${totalExpenses != null ? 'LKR ' + totalExpenses : 'LKR 0.00'}">LKR 0.00</div>
                    </div>
                    <div class="card" style="padding: 1.5rem;">
                        <div style="font-size: 0.875rem; color: var(--color-muted-text); margin-bottom: 0.5rem;">Remaining Budget</div>
                        <div style="font-size: 2rem; font-weight: 600;" th:style="${remainingBudget != null && remainingBudget.compareTo(java.math.BigDecimal.ZERO) < 0 ? 'color: var(--color-error);' : 'color: var(--color-deep-burgundy);'}" th:text="${remainingBudget != null ? 'LKR ' + remainingBudget : 'LKR 0.00'}">LKR 0.00</div>
                    </div>
                </div>

                <!-- Expenses Section -->
                <div class="card">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>Expenses</h3>
                        <a th:href="@{/finance/expense/new(weddingId=${wedding.id})}" class="btn btn-primary btn-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            Add Expense
                        </a>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Amount (LKR)</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${expenses.isEmpty()}">
                                    <td colspan="5" style="text-align: center; padding: 3rem;">
                                        <div class="empty-state">
                                            <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                                            </svg>
                                            <h4 class="empty-state-title">No Expenses</h4>
                                            <p class="empty-state-text">Track your wedding expenses here</p>
                                            <a th:href="@{/finance/expense/new(weddingId=${wedding.id})}" class="btn btn-primary btn-sm">Add First Expense</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="expense : ${expenses}">
                                    <td th:text="${expense.description}">Description</td>
                                    <td th:text="${expense.category != null ? expense.category : '-'}">Category</td>
                                    <td th:text="${#temporals.format(expense.expenseDate, 'MMM dd, yyyy')}">Jan 01, 2025</td>
                                    <td style="color: var(--color-error); font-weight: 500;" th:text="${'LKR ' + expense.amount}">LKR 0.00</td>
                                    <td>
                                        <form th:action="@{/finance/expense/delete/{id}(id=${expense.id}, weddingId=${wedding.id})}"
                                              method="post"
                                              onsubmit="return confirm('Are you sure you want to delete this expense?');"
                                              style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
